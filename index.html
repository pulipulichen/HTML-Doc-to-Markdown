<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multi-Format Office to Obsidian Converter</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 引入必要的函式庫 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
    <script src="https://unpkg.com/turndown/dist/turndown.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
    <!-- PDF.js 用於處理 PDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.min.js"></script>
    <style>
        .drop-zone {
            border: 2px dashed #cbd5e1;
            transition: all 0.3s ease;
        }
        .drop-zone.drag-over {
            border-color: #3b82f6;
            background-color: #eff6ff;
        }
        pre {
            white-space: pre-wrap;
            word-wrap: break-word;
        }
        .scrollbar-thin::-webkit-scrollbar { width: 6px; }
        .scrollbar-thin::-webkit-scrollbar-track { background: #f1f1f1; }
        .scrollbar-thin::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen font-sans text-slate-900">

    <div class="max-w-6xl mx-auto py-10 px-4">
        <header class="text-center mb-10">
            <div class="inline-flex items-center justify-center p-3 bg-indigo-600 rounded-xl mb-4 shadow-lg shadow-indigo-200">
                <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"></path></svg>
            </div>
            <h1 class="text-3xl font-bold text-slate-800 mb-2">全能 Office 轉 Obsidian</h1>
            <p class="text-slate-600 font-medium">支援 <span class="text-blue-600">Docx</span>, <span class="text-orange-600">Pptx</span>, <span class="text-red-600">Pdf</span>, <span class="text-green-600">Odt</span>, <span class="text-emerald-600">Odp</span></p>
        </header>

        <!-- 操作區 -->
        <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-8 mb-8">
            <div id="dropZone" class="drop-zone rounded-xl p-10 text-center cursor-pointer mb-6 group hover:border-indigo-400">
                <div class="flex flex-col items-center">
                    <svg class="w-12 h-12 text-slate-400 mb-4 group-hover:text-indigo-500 transition" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"></path>
                    </svg>
                    <p class="text-lg text-slate-700 font-semibold">拖放檔案到這裡</p>
                    <p class="text-sm text-slate-400 mt-2">支援 docx, pptx, pdf, odt, odp 格式</p>
                    <input type="file" id="fileInput" class="hidden" accept=".docx,.pptx,.pdf,.odt,.odp">
                </div>
            </div>

            <div id="status" class="hidden text-center p-4 rounded-lg mb-4 text-sm font-medium"></div>

            <div id="actionButtons" class="hidden flex justify-center gap-4">
                <button id="downloadBtn" class="bg-indigo-600 hover:bg-indigo-700 text-white px-8 py-3 rounded-xl font-bold transition flex items-center gap-2 shadow-md">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
                    下載 Obsidian ZIP 打包檔
                </button>
            </div>
        </div>

        <!-- 預覽區 -->
        <div id="previewContainer" class="hidden grid grid-cols-1 lg:grid-cols-2 gap-6">
            <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden flex flex-col h-[600px]">
                <div class="bg-slate-50 px-4 py-3 border-b border-slate-200 flex justify-between items-center">
                    <span class="text-sm font-bold text-slate-700">Markdown 預覽</span>
                    <span class="text-xs font-bold px-2 py-1 rounded" id="fileTypeBadge"></span>
                </div>
                <div class="p-6 flex-grow overflow-auto scrollbar-thin">
                    <pre id="markdownPreview" class="text-sm leading-relaxed text-slate-800"></pre>
                </div>
            </div>
            
            <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden flex flex-col h-[600px]">
                <div class="bg-slate-50 px-4 py-3 border-b border-slate-200 flex justify-between items-center">
                    <span class="text-sm font-bold text-slate-700">附件資源 (<span id="imageCount">0</span>)</span>
                </div>
                <div id="imagePreview" class="p-4 grid grid-cols-2 sm:grid-cols-3 gap-4 flex-grow overflow-auto bg-slate-50/50 scrollbar-thin">
                    <!-- 圖片會顯示在這裡 -->
                </div>
            </div>
        </div>
    </div>

    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.worker.min.js';

        const dropZone = document.getElementById('dropZone');
        const fileInput = document.getElementById('fileInput');
        const status = document.getElementById('status');
        const actionButtons = document.getElementById('actionButtons');
        const downloadBtn = document.getElementById('downloadBtn');
        const markdownPreview = document.getElementById('markdownPreview');
        const imagePreview = document.getElementById('imagePreview');
        const imageCountDisplay = document.getElementById('imageCount');
        const previewContainer = document.getElementById('previewContainer');
        const fileTypeBadge = document.getElementById('fileTypeBadge');

        let currentData = { markdown: '', images: [], fileName: '', extension: '' };

        const turndownService = new TurndownService({ headingStyle: 'atx', codeBlockStyle: 'fenced' });

        // Event Listeners
        dropZone.addEventListener('click', () => fileInput.click());
        dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.classList.add('drag-over'); });
        dropZone.addEventListener('dragleave', () => { dropZone.classList.remove('drag-over'); });
        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.classList.remove('drag-over');
            const file = e.dataTransfer.files[0];
            if (file) handleFile(file);
        });

        fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) handleFile(file);
        });

        async function handleFile(file) {
            const ext = file.name.split('.').pop().toLowerCase();
            const allowed = ['docx', 'pptx', 'pdf', 'odt', 'odp'];
            if (!allowed.includes(ext)) {
                showMessage('不支援的格式：' + ext, 'error');
                return;
            }

            showMessage('正在解析 ' + ext.toUpperCase() + ' 檔案...', 'info');
            currentData = { markdown: '', images: [], fileName: file.name.split('.')[0], extension: ext };
            imagePreview.innerHTML = '';
            
            try {
                switch(ext) {
                    case 'docx': await processDocx(file); break;
                    case 'pptx': await processPptx(file); break;
                    case 'pdf':  await processPdf(file); break;
                    case 'odt':  await processOpenDocument(file, 'text'); break;
                    case 'odp':  await processOpenDocument(file, 'presentation'); break;
                }
                displayResult();
                showMessage('解析成功！', 'success');
            } catch (err) {
                console.error(err);
                showMessage('轉換失敗：' + err.message, 'error');
            }
        }

        // --- Processors ---

        async function processDocx(file) {
            const arrayBuffer = await file.arrayBuffer();
            const options = {
                convertImage: mammoth.images.imgElement(async (image) => {
                    const ext = image.contentType.split('/')[1];
                    const name = `image_${currentData.images.length + 1}.${ext}`;
                    const blob = new Blob([await image.read()], { type: image.contentType });
                    currentData.images.push({ name, blob });
                    return { src: `attachments/${name}` };
                })
            };
            const result = await mammoth.convertToHtml({ arrayBuffer }, options);
            currentData.markdown = turndownService.turndown(result.value);
        }

        async function processPptx(file) {
            const zip = await JSZip.loadAsync(file);
            let mdContent = `# ${currentData.fileName}\n\n`;
            
            // Extract Media
            const mediaFiles = Object.keys(zip.files).filter(p => p.startsWith('ppt/media/'));
            for (const path of mediaFiles) {
                const blob = await zip.file(path).async('blob');
                currentData.images.push({ name: path.split('/').pop(), blob });
            }

            // Extract Slides Text
            const slidePaths = Object.keys(zip.files).filter(p => p.startsWith('ppt/slides/slide') && p.endsWith('.xml')).sort();
            const parser = new DOMParser();
            for (let i = 0; i < slidePaths.length; i++) {
                const xml = await zip.file(slidePaths[i]).async('string');
                const doc = parser.parseFromString(xml, "text/xml");
                const texts = Array.from(doc.getElementsByTagName('a:t')).map(n => n.textContent).join(' ');
                mdContent += `## Slide ${i+1}\n\n${texts}\n\n---\n\n`;
            }

            if (currentData.images.length > 0) {
                mdContent += `\n## 附件圖片\n\n` + currentData.images.map(img => `![[attachments/${img.name}]]`).join('\n');
            }
            currentData.markdown = mdContent;
        }

        async function processPdf(file) {
            const arrayBuffer = await file.arrayBuffer();
            const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
            let mdContent = `# ${currentData.fileName}\n\n`;

            for (let i = 1; i <= pdf.numPages; i++) {
                const page = await pdf.getPage(i);
                const textContent = await page.getTextContent();
                const text = textContent.items.map(item => item.str).join(' ');
                mdContent += `### Page ${i}\n\n${text}\n\n`;
            }
            currentData.markdown = mdContent;
            // 注意：純前端提取 PDF 圖片非常複雜，目前僅提供文字提取。
        }

        async function processOpenDocument(file, type) {
            const zip = await JSZip.loadAsync(file);
            const contentXml = await zip.file('content.xml').async('string');
            const parser = new DOMParser();
            const doc = parser.parseFromString(contentXml, "text/xml");
            
            let mdContent = `# ${currentData.fileName}\n\n`;

            // Extract Text
            const paragraphs = doc.getElementsByTagName('text:p');
            for (const p of paragraphs) {
                mdContent += p.textContent + "\n\n";
            }

            // Extract Images (ODT/ODP 圖片通常在 Pictures/ 資料夾)
            const pictures = Object.keys(zip.files).filter(p => p.startsWith('Pictures/'));
            for (const path of pictures) {
                const blob = await zip.file(path).async('blob');
                const name = path.split('/').pop();
                currentData.images.push({ name, blob });
            }

            if (currentData.images.length > 0) {
                mdContent += `\n## 附件圖片\n\n` + currentData.images.map(img => `![[attachments/${img.name}]]`).join('\n');
            }

            currentData.markdown = mdContent;
        }

        // --- UI Utils ---

        function displayResult() {
            previewContainer.classList.remove('hidden');
            actionButtons.classList.remove('hidden');
            markdownPreview.textContent = currentData.markdown;
            imageCountDisplay.textContent = currentData.images.length;
            
            const badge = fileTypeBadge;
            badge.textContent = currentData.extension.toUpperCase();
            const colors = { docx: 'bg-blue-100 text-blue-700', pptx: 'bg-orange-100 text-orange-700', pdf: 'bg-red-100 text-red-700', odt: 'bg-green-100 text-green-700', odp: 'bg-emerald-100 text-emerald-700' };
            badge.className = `text-xs font-bold px-2 py-1 rounded ${colors[currentData.extension] || 'bg-slate-100'}`;

            imagePreview.innerHTML = '';
            currentData.images.forEach(img => {
                const div = document.createElement('div');
                div.className = 'bg-white border rounded-lg p-2 flex flex-col items-center shadow-sm';
                const imgEl = document.createElement('img');
                imgEl.src = URL.createObjectURL(img.blob);
                imgEl.className = 'w-full h-24 object-contain mb-2 rounded bg-slate-100';
                const span = document.createElement('span');
                span.className = 'text-[10px] text-slate-500 truncate w-full text-center';
                span.textContent = img.name;
                div.append(imgEl, span);
                imagePreview.appendChild(div);
            });
        }

        downloadBtn.addEventListener('click', async () => {
            const zip = new JSZip();
            zip.file(`${currentData.fileName}.md`, currentData.markdown);
            const folder = zip.folder("attachments");
            currentData.images.forEach(img => folder.file(img.name, img.blob));
            const content = await zip.generateAsync({ type: "blob" });
            saveAs(content, `${currentData.fileName}_obsidian.zip`);
        });

        function showMessage(msg, type) {
            status.classList.remove('hidden', 'bg-blue-50', 'text-blue-700', 'bg-red-50', 'text-red-700', 'bg-green-50', 'text-green-700');
            const style = type === 'info' ? 'bg-blue-50 text-blue-700' : type === 'error' ? 'bg-red-50 text-red-700' : 'bg-green-50 text-green-700';
            status.className = `text-center p-4 rounded-lg mb-4 text-sm font-medium ${style}`;
            status.textContent = msg;
        }
    </script>
</body>
</html>

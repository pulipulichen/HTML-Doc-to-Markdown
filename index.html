<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Office to Obsidian Converter</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 引入必要的函式庫 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
    <script src="https://unpkg.com/turndown/dist/turndown.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
    <style>
        .drop-zone {
            border: 2px dashed #cbd5e1;
            transition: all 0.3s ease;
        }
        .drop-zone.drag-over {
            border-color: #3b82f6;
            background-color: #eff6ff;
        }
        pre {
            white-space: pre-wrap;
            word-wrap: break-word;
        }
    </style>
</head>
<body class="bg-slate-50 min-h-screen font-sans text-slate-900">

    <div class="max-w-6xl mx-auto py-10 px-4">
        <header class="text-center mb-10">
            <div class="inline-flex items-center justify-center p-3 bg-blue-600 rounded-xl mb-4 shadow-lg shadow-blue-200">
                <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
            </div>
            <h1 class="text-3xl font-bold text-slate-800 mb-2">Office 轉 Obsidian Markdown</h1>
            <p class="text-slate-600 font-medium">支援 <span class="text-blue-600">.docx</span> 與 <span class="text-orange-600">.pptx</span>，自動提取圖片並建立附件連結</p>
        </header>

        <!-- 操作區 -->
        <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-8 mb-8">
            <div id="dropZone" class="drop-zone rounded-xl p-10 text-center cursor-pointer mb-6 group hover:border-blue-400">
                <div class="flex flex-col items-center">
                    <svg class="w-12 h-12 text-slate-400 mb-4 group-hover:text-blue-500 transition" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"></path>
                    </svg>
                    <p class="text-lg text-slate-700">拖放 .docx 或 .pptx 檔案到這裡</p>
                    <p class="text-sm text-slate-400 mt-2">完全於瀏覽器運作，隱私安全</p>
                    <input type="file" id="fileInput" class="hidden" accept=".docx,.pptx">
                </div>
            </div>

            <div id="status" class="hidden text-center p-4 rounded-lg mb-4 text-sm font-medium"></div>

            <div id="actionButtons" class="hidden flex justify-center gap-4">
                <button id="downloadBtn" class="bg-blue-600 hover:bg-blue-700 text-white px-8 py-3 rounded-xl font-bold transition flex items-center gap-2 shadow-md">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
                    下載 ZIP 打包檔 (包含圖片)
                </button>
            </div>
        </div>

        <!-- 預覽區 -->
        <div id="previewContainer" class="hidden grid grid-cols-1 lg:grid-cols-2 gap-6">
            <!-- Markdown 預覽 -->
            <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden flex flex-col h-[600px]">
                <div class="bg-slate-50 px-4 py-3 border-b border-slate-200 flex justify-between items-center">
                    <span class="text-sm font-bold text-slate-700">Markdown 內容</span>
                    <span class="text-xs bg-slate-200 px-2 py-1 rounded text-slate-600" id="fileTypeBadge"></span>
                </div>
                <div class="p-6 flex-grow overflow-auto scrollbar-thin">
                    <pre id="markdownPreview" class="text-sm leading-relaxed text-slate-800"></pre>
                </div>
            </div>
            
            <!-- 圖片預覽 -->
            <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden flex flex-col h-[600px]">
                <div class="bg-slate-50 px-4 py-3 border-b border-slate-200 flex justify-between items-center">
                    <span class="text-sm font-bold text-slate-700">附件資源 (<span id="imageCount">0</span>)</span>
                </div>
                <div id="imagePreview" class="p-4 grid grid-cols-2 sm:grid-cols-3 gap-4 flex-grow overflow-auto bg-slate-50/50">
                    <!-- 圖片會顯示在這裡 -->
                </div>
            </div>
        </div>
    </div>

    <script>
        const dropZone = document.getElementById('dropZone');
        const fileInput = document.getElementById('fileInput');
        const status = document.getElementById('status');
        const actionButtons = document.getElementById('actionButtons');
        const downloadBtn = document.getElementById('downloadBtn');
        const markdownPreview = document.getElementById('markdownPreview');
        const imagePreview = document.getElementById('imagePreview');
        const imageCountDisplay = document.getElementById('imageCount');
        const previewContainer = document.getElementById('previewContainer');
        const fileTypeBadge = document.getElementById('fileTypeBadge');

        let currentData = {
            markdown: '',
            images: [], // { name: string, blob: Blob, contentType: string }
            fileName: '',
            extension: ''
        };

        const turndownService = new TurndownService({
            headingStyle: 'atx',
            codeBlockStyle: 'fenced'
        });

        dropZone.addEventListener('click', () => fileInput.click());
        dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.classList.add('drag-over'); });
        dropZone.addEventListener('dragleave', () => { dropZone.classList.remove('drag-over'); });
        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.classList.remove('drag-over');
            const file = e.dataTransfer.files[0];
            if (file) handleFile(file);
        });

        fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) handleFile(file);
        });

        async function handleFile(file) {
            const ext = file.name.split('.').pop().toLowerCase();
            if (!['docx', 'pptx'].includes(ext)) {
                showMessage('不支援的格式，請上傳 .docx 或 .pptx', 'error');
                return;
            }

            showMessage('正在解析檔案...', 'info');
            currentData = { markdown: '', images: [], fileName: file.name.split('.')[0], extension: ext };
            imagePreview.innerHTML = '';
            
            try {
                if (ext === 'docx') {
                    await processDocx(file);
                } else if (ext === 'pptx') {
                    await processPptx(file);
                }
                displayResult();
                showMessage('解析成功！', 'success');
            } catch (err) {
                console.error(err);
                showMessage('轉換失敗：' + err.message, 'error');
            }
        }

        async function processDocx(file) {
            const arrayBuffer = await file.arrayBuffer();
            const options = {
                convertImage: mammoth.images.imgElement(async (image) => {
                    const extension = image.contentType.split('/')[1];
                    const imgName = `image_${currentData.images.length + 1}.${extension}`;
                    const blobData = await image.read();
                    const blob = new Blob([blobData], { type: image.contentType });
                    
                    currentData.images.push({ name: imgName, blob: blob, contentType: image.contentType });
                    return { src: `attachments/${imgName}` };
                })
            };

            const result = await mammoth.convertToHtml({ arrayBuffer }, options);
            currentData.markdown = turndownService.turndown(result.value);
        }

        async function processPptx(file) {
            const zip = await JSZip.loadAsync(file);
            let mdContent = `# ${currentData.fileName}\n\n`;
            
            // 1. 提取所有圖片 (存儲於 ppt/media/)
            const mediaFiles = Object.keys(zip.files).filter(path => path.startsWith('ppt/media/'));
            const imageMap = {}; // 用於追蹤已提取的圖片

            for (const path of mediaFiles) {
                const blob = await zip.file(path).async('blob');
                const name = path.split('/').pop();
                currentData.images.push({ name: name, blob: blob, contentType: blob.type });
                imageMap[name] = true;
            }

            // 2. 解析投影片 (按順序)
            // 先找 presentation.xml.rels 獲取 slide 順序
            const slidePaths = Object.keys(zip.files)
                .filter(path => path.startsWith('ppt/slides/slide') && path.endsWith('.xml'))
                .sort((a, b) => {
                    const numA = parseInt(a.match(/\d+/)[0]);
                    const numB = parseInt(b.match(/\d+/)[0]);
                    return numA - numB;
                });

            const parser = new DOMParser();

            for (let i = 0; i < slidePaths.length; i++) {
                const slideXml = await zip.file(slidePaths[i]).async('string');
                const xmlDoc = parser.parseFromString(slideXml, "text/xml");
                
                mdContent += `## Slide ${i + 1}\n\n`;
                
                // 提取投影片文字
                const textNodes = xmlDoc.getElementsByTagName('a:t');
                let slideText = "";
                for (const node of textNodes) {
                    slideText += node.textContent + " ";
                }
                
                if (slideText.trim()) {
                    mdContent += slideText.trim() + "\n\n";
                }

                // 檢查該投影片引用的圖片 (簡化處理：若 PPT 圖片多，則此處列出該投影片大致可能關聯的圖片)
                // 實際上 PPT 的 rels 關係較複雜，這裡我們採用直接列出資源的方式
                
                mdContent += `---\n\n`;
            }
            
            // 如果有圖片但沒在內文引用，在末尾列出所有圖片方便用戶使用
            if (currentData.images.length > 0) {
                mdContent += `\n## 附件圖片目錄\n\n`;
                currentData.images.forEach(img => {
                    mdContent += `![[attachments/${img.name}]]\n`;
                });
            }

            currentData.markdown = mdContent;
        }

        function displayResult() {
            previewContainer.classList.remove('hidden');
            actionButtons.classList.remove('hidden');
            markdownPreview.textContent = currentData.markdown;
            imageCountDisplay.textContent = currentData.images.length;
            fileTypeBadge.textContent = currentData.extension.toUpperCase();
            
            imagePreview.innerHTML = '';
            currentData.images.forEach(img => {
                const container = document.createElement('div');
                container.className = 'bg-white border border-slate-200 rounded-lg p-2 flex flex-col items-center shadow-sm';
                
                const imgEl = document.createElement('img');
                imgEl.src = URL.createObjectURL(img.blob);
                imgEl.className = 'w-full h-24 object-contain mb-2 rounded';
                
                const label = document.createElement('span');
                label.className = 'text-[10px] text-slate-500 truncate w-full text-center';
                label.textContent = img.name;

                container.appendChild(imgEl);
                container.appendChild(label);
                imagePreview.appendChild(container);
            });
        }

        downloadBtn.addEventListener('click', async () => {
            const zip = new JSZip();
            const baseName = currentData.fileName;
            
            zip.file(`${baseName}.md`, currentData.markdown);
            const imgFolder = zip.folder("attachments");
            currentData.images.forEach(img => {
                imgFolder.file(img.name, img.blob);
            });

            const content = await zip.generateAsync({ type: "blob" });
            saveAs(content, `${baseName}_obsidian_pack.zip`);
        });

        function showMessage(msg, type) {
            status.classList.remove('hidden', 'bg-blue-50', 'text-blue-700', 'bg-red-50', 'text-red-700', 'bg-green-50', 'text-green-700');
            if (type === 'info') status.classList.add('bg-blue-50', 'text-blue-700');
            if (type === 'error') status.classList.add('bg-red-50', 'text-red-700');
            if (type === 'success') status.classList.add('bg-green-50', 'text-green-700');
            status.textContent = msg;
        }
    </script>
</body>
</html>
